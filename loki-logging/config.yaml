auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    address: 127.0.0.1 # For single-node: 127.0.0.1 ok. For docker/multi-node set to container hostname or 0.0.0.0 and advertise proper addr.
    ring:
      kvstore:
        store: inmemory # Use consul/etcd/memberlist for multi-node in production
      replication_factor: 1

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
  filesystem:
    directory: /loki/chunks

limits_config:
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_cache_freshness_per_query: 10m
  allow_structured_metadata: false

compactor:
  working_directory: /tmp/loki/compactor
