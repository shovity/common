services:
  viettts:
    image: viet-tts:latest
    networks:
      - backend
    environment:
      - DEVICE=cpu # cpu or cuda
      - PORT=7860
    ports:
      - 7860:7860
    restart: unless-stopped
    logging:
      options:
        max-size: 5m

networks:
  backend:
    name: backend
    external: true
