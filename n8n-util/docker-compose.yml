services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - ${PORT}:5678
    volumes:
      - ${MOUNT_DATA}/n8n:/home/node/.n8n
      - ${MOUNT_DATA}/cache:/home/node/.cache/n8n
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    restart: unless-stopped
    networks:
      - backend
    logging:
      options:
        max-size: 5m

networks:
  backend:
    name: backend
    external: true
